<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="pyBg" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="pyColors" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#pyBg)"/>

  <!-- Node-based pipeline / Automation Graph -->
  <g stroke="#3b82f6" stroke-width="2" opacity="0.4">
    <line x1="240" y1="180" x2="380" y2="180"/>
    <line x1="380" y1="180" x2="520" y2="140"/>
    <line x1="380" y1="180" x2="520" y2="230"/>
  </g>

  <!-- Node 1: Mesh Ingest -->
  <rect x="140" y="150" width="120" height="60" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="200" y="185" fill="#f8fafc" font-family="monospace" font-size="12" text-anchor="middle">FBX/GLTF Ingest</text>

  <!-- Node 2: Python Optimizer & LOD Generator -->
  <rect x="360" y="150" width="140" height="60" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="2"/>
  <text x="430" y="177" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">PyCook Tool</text>
  <text x="430" y="196" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">LOD &amp; Texture Bake</text>

  <!-- Node 3: UE5 / Unity Export -->
  <rect x="520" y="110" width="130" height="55" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="585" y="142" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">&rarr; UE5 Asset</text>

  <rect x="520" y="200" width="130" height="55" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="585" y="232" fill="#34d399" font-family="monospace" font-size="11" text-anchor="middle">&rarr; Unity Prefab</text>

  <!-- Python Badge -->
  <rect x="30" y="30" width="160" height="34" rx="8" fill="#000" opacity="0.75" stroke="#eab308" stroke-width="1"/>
  <text x="110" y="52" fill="#facc15" font-family="system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="middle">PYTHON &amp; TOOLING</text>

  <!-- Title -->
  <text x="400" y="365" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="28" letter-spacing="2" text-anchor="middle">PYPIPELINE AUTOMATION</text>
  <text x="400" y="390" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Asset Pipeline &bull; Automated LODs &amp; Collision Mesh Generation</text>
</svg>
