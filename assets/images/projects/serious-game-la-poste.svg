<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="vrBg" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#192841"/>
    </linearGradient>
    <linearGradient id="laposteYellow" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="vrCyan" x1="0%" y1="0%" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#vrBg)"/>

  <!-- Warehouse / Virtual Logistics Perspective Grid -->
  <g stroke="#38bdf8" stroke-width="0.8" opacity="0.2">
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="390" x2="800" y2="390"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="400" y1="240" x2="0" y2="450"/>
    <line x1="400" y1="240" x2="200" y2="450"/>
    <line x1="400" y1="240" x2="400" y2="450"/>
    <line x1="400" y1="240" x2="600" y2="450"/>
    <line x1="400" y1="240" x2="800" y2="450"/>
  </g>

  <!-- Pallet & Transpalette Stylized Silhouette -->
  <!-- Pallet -->
  <rect x="330" y="270" width="140" height="30" rx="4" fill="#854d0e" opacity="0.7" stroke="#ca8a04" stroke-width="1.5"/>
  <rect x="340" y="225" width="55" height="45" rx="3" fill="#eab308" opacity="0.8" stroke="#facc15" stroke-width="1.5"/>
  <rect x="405" y="225" width="55" height="45" rx="3" fill="#3b82f6" opacity="0.8" stroke="#60a5fa" stroke-width="1.5"/>

  <!-- VR Headset floating icon / wireframe -->
  <g transform="translate(400, 140)">
    <!-- VR Visor -->
    <rect x="-65" y="-35" width="130" height="70" rx="22" fill="#0f172a" stroke="url(#vrCyan)" stroke-width="3"/>
    <!-- Glowing Visor screen -->
    <path d="M-45 -10 Q-20 15 0 -10 Q20 15 45 -10" fill="none" stroke="#06b6d4" stroke-width="2.5" opacity="0.7"/>
    <!-- VR Sensors / LEDs -->
    <circle cx="-35" cy="-15" r="3" fill="#06b6d4"/>
    <circle cx="35" cy="-15" r="3" fill="#06b6d4"/>
    <circle cx="0" cy="15" r="3" fill="#facc15"/>
    <!-- Headband -->
    <path d="M-65 -5 C-100 -5 -100 5 -65 5" fill="none" stroke="#64748b" stroke-width="3"/>
    <path d="M65 -5 C100 -5 100 5 65 5" fill="none" stroke="#64748b" stroke-width="3"/>
    <!-- Top Strap -->
    <path d="M0 -35 C0 -60 0 -60 0 -35" fill="none" stroke="#64748b" stroke-width="3"/>
  </g>

  <!-- La Poste & VR Badges -->
  <rect x="30" y="30" width="170" height="34" rx="8" fill="#000" opacity="0.75" stroke="#facc15" stroke-width="1.2"/>
  <text x="115" y="52" fill="#facc15" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">VR &bull; SERIOUS GAME</text>

  <rect x="210" y="30" width="160" height="34" rx="8" fill="#000" opacity="0.75" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="290" y="52" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">PROJET LA POSTE</text>

  <!-- Title -->
  <text x="400" y="360" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="28" letter-spacing="2" text-anchor="middle">FORMATION VR &bull; LA POSTE</text>
  <text x="400" y="388" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Simulation Virtuelle &bull; Conduite Transpalette &bull; Sensibilisation aux Risques</text>
</svg>
