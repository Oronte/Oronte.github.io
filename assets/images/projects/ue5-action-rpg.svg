<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0e1a"/>
      <stop offset="100%" stop-color="#1e1435"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0b0e1a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Perspective Grid (Unreal Engine aesthetic) -->
  <g stroke="#3b82f6" stroke-width="0.8" opacity="0.25">
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="390" x2="800" y2="390"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="400" y1="260" x2="0" y2="450"/>
    <line x1="400" y1="260" x2="200" y2="450"/>
    <line x1="400" y1="260" x2="400" y2="450"/>
    <line x1="400" y1="260" x2="600" y2="450"/>
    <line x1="400" y1="260" x2="800" y2="450"/>
  </g>

  <!-- Glowing Portal / Magic Core -->
  <circle cx="400" cy="210" r="130" fill="url(#portalGlow)"/>
  <circle cx="400" cy="210" r="70" fill="none" stroke="url(#neon)" stroke-width="3" stroke-dasharray="12 6"/>
  <circle cx="400" cy="210" r="45" fill="#1e1b4b" stroke="#06b6d4" stroke-width="2"/>
  
  <!-- Stylized Sci-Fi Obelisks -->
  <polygon points="310,290 330,140 345,145 330,295" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5"/>
  <polygon points="490,290 470,140 455,145 470,295" fill="#1e1b4b" stroke="#3b82f6" stroke-width="1.5"/>
  
  <!-- UE5 Badge -->
  <rect x="30" y="30" width="130" height="34" rx="8" fill="#000" opacity="0.75" stroke="#38bdf8" stroke-width="1"/>
  <text x="95" y="52" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="middle">UNREAL 5 &amp; C++</text>
  
  <!-- Title in artwork -->
  <text x="400" y="355" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="28" letter-spacing="2" text-anchor="middle">CHRONO PROTOCOL</text>
  <text x="400" y="380" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Third-Person Action RPG &bull; GAS Architecture &bull; Niagara VFX</text>
</svg>
