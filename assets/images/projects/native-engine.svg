<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="nativeBg" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f182c"/>
    </linearGradient>
    <linearGradient id="orangeNeon" x1="0%" y1="0%" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#nativeBg)"/>

  <!-- 3D Wireframe Mesh (Torus / Polyhedron) representing native engine graphics -->
  <g stroke="#f97316" stroke-width="1.4" fill="none" opacity="0.6">
    <!-- Wireframe Cube rotated -->
    <polygon points="400,100 520,160 400,220 280,160" stroke="#fb923c" fill="#f97316" fill-opacity="0.05"/>
    <polygon points="280,160 400,220 400,320 280,260" stroke="#f97316" fill="#f97316" fill-opacity="0.08"/>
    <polygon points="520,160 400,220 400,320 520,260" stroke="#ea580c" fill="#ea580c" fill-opacity="0.12"/>
    
    <!-- Coordinate Gizmo -->
    <line x1="400" y1="220" x2="400" y2="150" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <line x1="400" y1="220" x2="470" y2="250" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="400" y1="220" x2="330" y2="250" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Profiler / Code Overlay -->
  <rect x="520" y="70" width="220" height="120" rx="6" fill="#000" opacity="0.6" stroke="#475569" stroke-width="1"/>
  <text x="535" y="95" fill="#22c55e" font-family="monospace" font-size="11">Frametime: 2.14 ms (467 FPS)</text>
  <text x="535" y="115" fill="#94a3b8" font-family="monospace" font-size="11">Draw Calls: 148</text>
  <text x="535" y="135" fill="#94a3b8" font-family="monospace" font-size="11">Vulkan 1.3 | SPIR-V</text>
  <text x="535" y="155" fill="#f59e0b" font-family="monospace" font-size="11">VRAM Allocated: 412 MB</text>

  <!-- Native Badge -->
  <rect x="30" y="30" width="150" height="34" rx="8" fill="#000" opacity="0.75" stroke="#f97316" stroke-width="1"/>
  <text x="105" y="52" fill="#fb923c" font-family="system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="middle">C++20 &amp; VULKAN / GL</text>

  <!-- Title -->
  <text x="400" y="365" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="28" letter-spacing="2" text-anchor="middle">AETHER 3D ENGINE</text>
  <text x="400" y="390" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Custom Native Engine &bull; PBR Renderer &bull; Multi-threaded Job System</text>
</svg>
