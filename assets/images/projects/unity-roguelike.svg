<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="unityBg" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#091b1f"/>
      <stop offset="100%" stop-color="#0f2e24"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#unityBg)"/>
  
  <!-- Isometric Grid (Unity procedural style) -->
  <g stroke="#10b981" stroke-width="1.2" opacity="0.3">
    <!-- Isometric tiles -->
    <path d="M400 120 L550 190 L400 260 L250 190 Z" fill="#133d34"/>
    <path d="M400 260 L550 190 L550 220 L400 290 Z" fill="#0d2822"/>
    <path d="M400 260 L250 190 L250 220 L400 290 Z" fill="#1b4d42"/>
    
    <path d="M550 190 L700 260 L550 330 L400 260 Z" fill="#164339"/>
    <path d="M250 190 L400 260 L250 330 L100 260 Z" fill="#10352d"/>
  </g>

  <!-- Glowing Relic on tile -->
  <circle cx="400" cy="180" r="28" fill="#34d399" opacity="0.8"/>
  <circle cx="400" cy="180" r="14" fill="#ffffff"/>
  
  <!-- Unity Badge -->
  <rect x="30" y="30" width="130" height="34" rx="8" fill="#000" opacity="0.75" stroke="#34d399" stroke-width="1"/>
  <text x="95" y="52" fill="#34d399" font-family="system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="middle">UNITY &amp; C#</text>
  
  <!-- Text overlay -->
  <text x="400" y="365" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="28" letter-spacing="2" text-anchor="middle">DUNGEON RECURSION</text>
  <text x="400" y="390" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Procedural Roguelike &bull; DOTS / ECS &bull; Custom A* Pathfinding</text>
</svg>
